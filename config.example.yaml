# ─── Snipe v2 Config ────────────────────────────────────────
# Secrets (TELEGRAM_TOKEN, GROQ_API_KEY, APIFY_TOKEN) go in .env — not here.

groq:
  model: "openai/gpt-oss-20b"   # llama-3.1-8b-instant was retired by Groq
  reasoning_effort: low         # gpt-oss/qwen3 only — set to null for other models

# How often to scan for new opportunities (in minutes)
scan_interval: 30

# Cap on new alerts per scan; the rest roll over to the next scan (avoids a flood on first run)
max_alerts_per_scan: 15

# Timezone for quiet hours and daily digests
timezone: "Asia/Kolkata"

profile:
  location: "Chennai, India"
  type: "student"

# Keywords that define an opportunity worth alerting
opportunity_keywords:
  - hackathon
  - internship
  - fellowship
  - competition
  - contest
  - grant
  - scholarship
  - bounty
  - challenge
  - hiring
  - apply now
  - open applications
  - prize
  - ctf
  - capture the flag
  - jeopardy ctf
  - attack-defense

sources:
  # ── CTFtime (official CTF calendar, JSON API) ─────────────
  ctftime:
    enabled: true
    days_ahead: 45                       # how far ahead to look
    skip_restrictions: [Prequalified]    # finals you can't enter without qualifying

  # ── Unstop (dedicated paginated scanner) ──────────────────
  unstop:
    enabled: true
    max_pages: 2            # pages per type per scan cycle (15 items/page, newest first)
    search_terms:           # keyword searches; most Indian college CTFs are only on Unstop
      - ctf
      - capture the flag
    types:
      - hackathons
      - competitions
      - internships
      - scholarships

  # ── LinkedIn events ──────────────────────────────────────
  # LinkedIn hides event details behind a login wall, so details come from the
  # Apify actor "maximedupre/linkedin-events" (pay per event, ~$2.70 / 1,000).
  # Set APIFY_TOKEN in .env. Without it you still get event links, minus details.
  # Off by default: no-login scrapers find almost nothing (LinkedIn blocks search
  # engines from event pages). Tested Oct 2026: 0-1 events per query.
  linkedin:
    enabled: false
    interval_hours: 12      # LinkedIn runs are slow and billed, so not every scan
    max_charge_usd: 0.05    # hard spending cap per run, split across queries
    event_format: any       # any | virtual | in_person | hybrid
    locations: ["India"]
    queries:
      - "hackathon"
      - "tech workshop students"

  rss:
    - name: "TechCrunch Startups"
      url: "https://techcrunch.com/category/startups/feed/"
    - name: "YourStory"
      url: "https://yourstory.com/feed"
    - name: "Inc42"
      url: "https://inc42.com/feed/"
    - name: "HackerNews"
      url: "https://news.ycombinator.com/rss"
    - name: "r/securityCTF"
      url: "https://www.reddit.com/r/securityCTF/new/.rss"

  search_queries:
    - "hackathon India students 2026 open registration"
    - "internship India tech students apply 2026"
    - "fellowship India students technology 2026"
    - "student competition prize money India 2026"
    - "OpenAI competition students 2026"
    - "Google student program 2026 apply"
    - "CTF competition upcoming 2026"
